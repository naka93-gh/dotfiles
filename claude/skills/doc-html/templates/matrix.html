<!DOCTYPE html>
<!--
  マトリクス型テンプレート — 一覧・比較・進捗・テスト
  画面をほぼ全幅使う。フィルタバーと表ヘッダを固定し、行数が増えても操作性を保つ。
  {{ }} で囲まれた箇所を差し替え、不要な部品は削除する。
  行には data-* 属性で絞り込み用の値を持たせる（チップの data-* と対応させる）。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{タイトル}}</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-subtle: #f6f8fa;
    --bg-inset: #eceff2;
    --border: #d8dee4;
    --border-soft: #e6eaef;
    --text: #1f2328;
    --text-muted: #59636e;
    --text-faint: #838d97;
    --accent: #0b6bcb;
    --accent-soft: #e8f1fc;
    --green: #1a7f37;
    --green-soft: #e7f4ea;
    --amber: #9a6700;
    --amber-soft: #fdf3d4;
    --red: #cf222e;
    --red-soft: #ffeceb;
    --purple: #6639ba;
    --purple-soft: #f1eafc;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Courier New", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1560px; margin: 0 auto; padding: 0 1.5rem 5rem; }

  /* ---------- ヘッダ ---------- */
  header.page-head { padding: 2.5rem 0 1.5rem; }
  .eyebrow {
    display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
    color: var(--accent); background: var(--accent-soft);
    padding: 0.25rem 0.6rem; border-radius: 4px; margin-bottom: 0.8rem;
  }
  h1 { font-size: 1.8rem; letter-spacing: -0.01em; margin-bottom: 0.4rem; }
  .lead { color: var(--text-muted); font-size: 0.92rem; max-width: 780px; }
  code {
    font-family: var(--mono); font-size: 0.86em;
    background: var(--bg-inset); padding: 0.12em 0.4em; border-radius: 4px;
  }

  /* ---------- サマリー統計 ---------- */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75rem; margin: 1.75rem 0; }
  .stat { border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1.1rem; background: #fff; }
  .stat-num { font-size: 1.55rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 0.75rem; color: var(--text-faint); margin-top: 0.15rem; }
  .stat.ok .stat-num { color: var(--green); }
  .stat.warn .stat-num { color: var(--amber); }
  .stat.ng .stat-num { color: var(--red); }

  /* ---------- フィルタバー（上部固定） ---------- */
  .filters {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 0.85rem 0;
  }
  .filter-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .search { flex: 0 0 280px; position: relative; }
  .search input {
    width: 100%; font-family: var(--sans); font-size: 0.88rem;
    padding: 0.5rem 0.75rem 0.5rem 2rem;
    border: 1px solid var(--border); border-radius: 8px;
    background: #fff; color: var(--text); outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { position: absolute; left: 0.6rem; top: 50%; transform: translateY(-50%); }

  .chips { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .chip {
    font-family: var(--sans); font-size: 0.78rem;
    padding: 0.35rem 0.7rem;
    border: 1px solid var(--border); border-radius: 999px;
    background: #fff; color: var(--text-muted);
    cursor: pointer; white-space: nowrap; transition: all 0.12s;
  }
  .chip:hover { border-color: var(--text-faint); color: var(--text); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .divider { width: 1px; height: 22px; background: var(--border); }

  .count {
    margin-left: auto; font-size: 0.82rem; color: var(--text-muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .count b { color: var(--text); font-weight: 700; }
  .reset {
    font-family: var(--sans); font-size: 0.78rem; color: var(--accent);
    background: none; border: none; cursor: pointer;
    padding: 0.35rem 0.5rem; border-radius: 6px;
  }
  .reset:hover { background: var(--accent-soft); }

  /* ---------- テーブル ---------- */
  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 10px 10px;
  }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.86rem; }

  thead th {
    position: sticky;
    top: 55px; /* フィルタバーの高さ分だけ下げる */
    z-index: 20;
    background: var(--bg-subtle);
    text-align: left; padding: 0.65rem 0.9rem;
    font-size: 0.76rem; letter-spacing: 0.03em; color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap; cursor: pointer; user-select: none;
  }
  thead th:hover { background: var(--bg-inset); color: var(--text); }
  thead th .arrow { opacity: 0; margin-left: 0.3rem; font-size: 0.7rem; }
  thead th.sorted { color: var(--text); }
  thead th.sorted .arrow { opacity: 1; color: var(--accent); }

  /* 先頭列を固定して、横スクロールしても対象を見失わない */
  th.sticky-col, td.sticky-col {
    position: sticky; left: 0; z-index: 10;
    background: #fff; border-right: 1px solid var(--border-soft);
  }
  thead th.sticky-col { z-index: 25; background: var(--bg-subtle); }

  tbody td {
    padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--border-soft);
    vertical-align: top; line-height: 1.6;
  }
  tbody tr:nth-child(even) td,
  tbody tr:nth-child(even) td.sticky-col { background: #fbfcfd; }
  tbody tr:hover td,
  tbody tr:hover td.sticky-col { background: var(--accent-soft); }

  td.mono { font-family: var(--mono); font-size: 0.8rem; white-space: nowrap; }
  td.mono.muted { color: var(--text-muted); }
  td.wide { min-width: 320px; }

  .tag {
    display: inline-block; font-size: 0.72rem; font-weight: 600;
    padding: 0.15rem 0.5rem; border-radius: 5px; white-space: nowrap;
  }
  .tag.a { background: var(--green-soft); color: var(--green); }
  .tag.b { background: var(--red-soft); color: var(--red); }
  .tag.c { background: var(--purple-soft); color: var(--purple); }

  .status { display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap; font-size: 0.8rem; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status.ok   { color: var(--green); } .status.ok .dot   { background: var(--green); }
  .status.warn { color: var(--amber); } .status.warn .dot { background: var(--amber); }
  .status.ng   { color: var(--red); }   .status.ng .dot   { background: var(--red); }

  .empty { padding: 3.5rem 1rem; text-align: center; color: var(--text-faint); font-size: 0.9rem; }

  @media (max-width: 1100px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .search { flex: 1 1 100%; }
    .count { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="page-head">
    <span class="eyebrow">{{種別（一覧・マトリクス 等）}}</span>
    <h1>{{タイトル}}</h1>
    <p class="lead">{{何の一覧か。どう使うか。生成元があれば明記する}}</p>

    <div class="stats">
      <div class="stat"><div class="stat-num">{{N}}</div><div class="stat-label">{{総数}}</div></div>
      <div class="stat ok"><div class="stat-num">{{N}}</div><div class="stat-label">{{状態A}}</div></div>
      <div class="stat warn"><div class="stat-num">{{N}}</div><div class="stat-label">{{状態B}}</div></div>
      <div class="stat ng"><div class="stat-num">{{N}}</div><div class="stat-label">{{状態C}}</div></div>
      <div class="stat"><div class="stat-num">{{N}}</div><div class="stat-label">{{区分数}}</div></div>
    </div>
  </header>

  <div class="filters">
    <div class="filter-row">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#838d97" stroke-width="1.6">
          <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14" stroke-linecap="round"/>
        </svg>
        <input type="text" id="q" placeholder="{{絞り込みの対象を書く}}" autocomplete="off">
      </div>

      <div class="divider"></div>

      <!-- チップの data-kind は行の data-kind と一致させる -->
      <div class="chips">
        <button class="chip" data-kind="{{区分A}}">{{区分A}}</button>
        <button class="chip" data-kind="{{区分B}}">{{区分B}}</button>
        <button class="chip" data-kind="{{区分C}}">{{区分C}}</button>
      </div>

      <div class="divider"></div>

      <div class="chips">
        <button class="chip" data-status="ok">{{状態A}}</button>
        <button class="chip" data-status="warn">{{状態B}}</button>
        <button class="chip" data-status="ng">{{状態C}}</button>
      </div>

      <button class="reset" id="reset">クリア</button>

      <div class="count"><b id="shown">{{N}}</b> / {{N}} 件</div>
    </div>
  </div>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th class="sticky-col">{{列1}}<span class="arrow">▲</span></th>
          <th>{{列2}}<span class="arrow">▲</span></th>
          <th>{{列3}}<span class="arrow">▲</span></th>
          <th>{{区分}}<span class="arrow">▲</span></th>
          <th>{{状態}}<span class="arrow">▲</span></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <!-- data-kind / data-status はチップの値と対応させる -->
        <tr data-kind="{{区分A}}" data-status="ok">
          <td class="sticky-col mono muted">{{値1}}</td>
          <td class="mono">{{値2}}</td>
          <td class="wide">{{値3}}</td>
          <td><span class="tag a">{{区分A}}</span></td>
          <td><span class="status ok"><span class="dot"></span>{{状態A}}</span></td>
        </tr>
        <tr data-kind="{{区分B}}" data-status="ng">
          <td class="sticky-col mono muted">{{値1}}</td>
          <td class="mono">{{値2}}</td>
          <td class="wide">{{値3}}</td>
          <td><span class="tag b">{{区分B}}</span></td>
          <td><span class="status ng"><span class="dot"></span>{{状態C}}</span></td>
        </tr>
      </tbody>
    </table>
    <div class="empty" id="empty" style="display:none">該当する項目がありません</div>
  </div>

</div>

<script>
  const tbody = document.getElementById('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const q = document.getElementById('q');
  const shown = document.getElementById('shown');
  const empty = document.getElementById('empty');

  // 選択中の絞り込み条件（同じ群の中では OR、群をまたぐと AND になる）
  const active = { kind: new Set(), status: new Set() };

  /**
   * 検索語と選択中のチップで行の表示可否を判定する
   */
  const applyFilter = () => {
    const term = q.value.trim().toLowerCase();
    let count = 0;

    rows.forEach(tr => {
      const matchText = !term || tr.textContent.toLowerCase().includes(term);
      const matchKind = active.kind.size === 0 || active.kind.has(tr.dataset.kind);
      const matchStatus = active.status.size === 0 || active.status.has(tr.dataset.status);
      const visible = matchText && matchKind && matchStatus;

      tr.style.display = visible ? '' : 'none';
      if (visible) count++;
    });

    shown.textContent = count;
    empty.style.display = count === 0 ? 'block' : 'none';
  };

  q.addEventListener('input', applyFilter);

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const group = chip.dataset.kind ? 'kind' : 'status';
      const value = chip.dataset.kind || chip.dataset.status;

      if (active[group].has(value)) {
        active[group].delete(value);
        chip.classList.remove('on');
      } else {
        active[group].add(value);
        chip.classList.add('on');
      }
      applyFilter();
    });
  });

  document.getElementById('reset').addEventListener('click', () => {
    q.value = '';
    active.kind.clear();
    active.status.clear();
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    applyFilter();
  });

  // 列ヘッダのクリックで並び替え。同じ列を再度押すと昇順・降順が入れ替わる
  const headers = Array.from(document.querySelectorAll('thead th'));
  let sortState = { index: -1, asc: true };

  headers.forEach((th, index) => {
    th.addEventListener('click', () => {
      const asc = sortState.index === index ? !sortState.asc : true;
      sortState = { index, asc };

      headers.forEach(h => h.classList.remove('sorted'));
      th.classList.add('sorted');
      th.querySelector('.arrow').textContent = asc ? '▲' : '▼';

      const sorted = rows.slice().sort((a, b) => {
        const av = a.children[index].textContent.trim();
        const bv = b.children[index].textContent.trim();
        return asc ? av.localeCompare(bv, 'ja') : bv.localeCompare(av, 'ja');
      });

      sorted.forEach(tr => tbody.appendChild(tr));
    });
  });
</script>

</body>
</html>
